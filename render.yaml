services:
  - type: web
    name: repair-accountant-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: DB_TYPE
        value: pg
      - key: DATABASE_URL
        fromDatabase:
          name: repair-accountant-db
          property: connectionString
    healthCheckPath: /api/health

databases:
  - name: repair-accountant-db
    plan: free
    region: frankfurt
